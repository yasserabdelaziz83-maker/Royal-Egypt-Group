name: Functions and Intake Tests

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/royal-eg-platform-completion-**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Pages Functions and browser scripts
        run: |
          find functions assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --experimental-default-type=module --check
      - name: Run synthetic application tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
